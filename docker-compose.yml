services:
  postgres:
    image: postgres:16-alpine
    container_name: gameserver-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gameserverhosting_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gameserver-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Game Server Hosting API
  api:
    build:
      context: .
      dockerfile: src/GameServerHosting.Api/Dockerfile
    container_name: gameserver-api
    restart: unless-stopped
    ports:
      - "5292:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=gameserverhosting_dev;Username=postgres;Password=postgres"
      JwtSettings__SecretKey: "REPLACE_WITH_A_STRONG_SECRET_KEY_AT_LEAST_32_CHARACTERS_LONG_FOR_PRODUCTION"
      JwtSettings__Issuer: "GameServerHosting.Api"
      JwtSettings__Audience: "GameServerHosting.Client"
      EmailSettings__Smtp__Host: "maildev"
      EmailSettings__Smtp__Port: "1025"
      EmailSettings__BaseUrl: "http://localhost:5173"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Stripe__PublishableKey: "${STRIPE_PUBLISHABLE_KEY:-}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      CloudProviders__DigitalOcean__ApiToken: "${DIGITALOCEAN_API_TOKEN:-}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__VirtualHost: "gameserver"
      RabbitMQ__Username: "gameserver"
      RabbitMQ__Password: "gameserver_dev_password"
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - gameserver-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Game Server Hosting Client (Blazor WASM)
  client:
    build:
      context: .
      dockerfile: src/GameServerHosting.Client/Dockerfile
    container_name: gameserver-client
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - gameserver-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # MailDev - Local SMTP server with web UI for development
  maildev:
    image: maildev/maildev:latest
    container_name: gameserver-maildev
    restart: unless-stopped
    ports:
      - "1080:1080"  # Web UI
      - "1025:1025"  # SMTP server
    networks:
      - gameserver-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:1080 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  # RabbitMQ - Message broker for background processing
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gameserver-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: gameserver
      RABBITMQ_DEFAULT_PASS: gameserver_dev_password
      RABBITMQ_DEFAULT_VHOST: gameserver
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gameserver-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional: pgAdmin for database management (accessible at http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gameserver-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@moskowite.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - gameserver-network
    depends_on:
      - postgres

networks:
  gameserver-network:
    driver: bridge
    name: gameserver-network

volumes:
  postgres_data:
    driver: local
    name: gameserver-postgres-data
  pgadmin_data:
    driver: local
    name: gameserver-pgadmin-data
  rabbitmq_data:
    driver: local
    name: gameserver-rabbitmq-data

