name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore GameServerHosting.sln
    
    - name: Check code formatting
      run: |
        echo "## Code Formatting 📝" >> $GITHUB_STEP_SUMMARY
        dotnet format GameServerHosting.sln --verify-no-changes --verbosity minimal
        if [ $? -eq 0 ]; then
          echo "✅ **Code is properly formatted**" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Formatting issues detected** (currently non-blocking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run \`dotnet format\` to fix formatting issues" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true
    
    - name: Build with analyzers
      run: |
        echo "## Build Analysis 🔍" >> $GITHUB_STEP_SUMMARY
        dotnet build GameServerHosting.sln --configuration Release --no-restore 2>&1 | tee build-output.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        
        WARNING_COUNT=$(grep -c "warning" build-output.log || echo "0")
        ERROR_COUNT=$(grep -c "error" build-output.log || echo "0")
        
        echo "- **Warnings**: $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **Errors**: $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
        
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Build failed**" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "⚠️ **Build successful with $WARNING_COUNT warning(s)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Build successful**" >> $GITHUB_STEP_SUMMARY
          fi
        fi
    
    - name: Quick security check
      run: |
        echo "## Security Check 🔒" >> $GITHUB_STEP_SUMMARY
        dotnet list GameServerHosting.sln package --vulnerable --include-transitive 2>&1 | tee security.log
        
        CRITICAL_COUNT=$(grep -i "critical" security.log | wc -l || echo "0")
        HIGH_COUNT=$(grep -i "high" security.log | wc -l || echo "0")
        
        echo "- **Critical**: $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **High**: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
        
        if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Vulnerabilities detected - will be checked in CI**" >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **No critical vulnerabilities**" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true
    
    - name: PR Size Check
      uses: actions/github-script@v8
      with:
        script: |
          const pr = context.payload.pull_request;
          const additions = pr.additions;
          const deletions = pr.deletions;
          const totalChanges = additions + deletions;
          
          let message = `## PR Size Analysis 📏\n\n`;
          message += `- **Additions**: ${additions}\n`;
          message += `- **Deletions**: ${deletions}\n`;
          message += `- **Total Changes**: ${totalChanges}\n\n`;
          
          if (totalChanges > 1000) {
            message += `⚠️ **Large PR Warning**: This PR is quite large (${totalChanges} lines). Consider breaking it into smaller PRs for easier review.\n`;
            core.warning(`Large PR detected: ${totalChanges} lines changed`);
          } else if (totalChanges > 500) {
            message += `ℹ️ This is a medium-sized PR. Review may take some time.\n`;
          } else {
            message += `✅ This is a reasonably sized PR.\n`;
          }
          
          await core.summary.addRaw(message).write();
    
    - name: Check PR Title Format
      uses: actions/github-script@v8
      with:
        script: |
          const pr = context.payload.pull_request;
          const title = pr.title;
          
          // Common PR title patterns
          const patterns = [
            /^feat:/i,
            /^fix:/i,
            /^docs:/i,
            /^style:/i,
            /^refactor:/i,
            /^test:/i,
            /^chore:/i,
            /^perf:/i,
            /^ci:/i,
            /^\[MOS-\d+\]/i  // Matches Linear issue IDs like [MOS-8]
          ];
          
          const hasValidPrefix = patterns.some(pattern => pattern.test(title));
          
          if (!hasValidPrefix) {
            core.warning(`PR title should follow conventional commits format (feat:, fix:, etc.) or include issue ID [MOS-X]`);
          }

  label-check:
    name: Label Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Check for labels
      uses: actions/github-script@v8
      with:
        script: |
          const pr = context.payload.pull_request;
          const labels = pr.labels.map(label => label.name);
          
          let message = `## PR Labels 🏷️\n\n`;
          
          if (labels.length === 0) {
            message += `⚠️ **No labels found**: Please add relevant labels to this PR.\n`;
            core.warning('No labels found on PR');
          } else {
            message += `**Labels**: ${labels.join(', ')}\n`;
          }
          
          await core.summary.addRaw(message).write();

  conflict-check:
    name: Merge Conflict Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Check for merge conflicts
      run: |
        git fetch origin ${{ github.base_ref }}
        if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q "<<<<<<"; then
          echo "::error::Merge conflicts detected. Please resolve conflicts before merging."
          exit 1
        else
          echo "✅ No merge conflicts detected"
        fi
