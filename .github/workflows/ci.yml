name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  COVERAGE_THRESHOLD: 80

jobs:
  database-migration-test:
    name: Database Migration Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameserverhosting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install EF Core tools
      run: dotnet tool install --global dotnet-ef
    
    - name: Restore dependencies
      run: dotnet restore GameServerHosting.sln
    
    - name: Build solution
      run: dotnet build GameServerHosting.sln --configuration Release --no-restore
    
    - name: Enable PostgreSQL UUID extension
      run: |
        docker run --rm --network host postgres:16-alpine \
          psql "postgresql://postgres:postgres@localhost:5432/gameserverhosting_test" \
          -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
        
        echo "✅ UUID extension enabled" >> $GITHUB_STEP_SUMMARY
    
    - name: Apply migrations to test database
      run: |
        echo "## Database Migration Test 🗄️" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Testing that all migrations apply successfully to a clean database..." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        cd src/GameServerHosting.Infrastructure
        
        # Apply migrations
        dotnet ef database update \
          --project . \
          --startup-project ../GameServerHosting.Api \
          --context GameServerDbContext \
          --verbose \
          --connection "Host=localhost;Database=gameserverhosting_test;Username=postgres;Password=postgres"
        
        if [ $? -eq 0 ]; then
          echo "✅ **All migrations applied successfully**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Failed to apply migrations**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
    
    - name: Verify database schema
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Database Tables Created" >> $GITHUB_STEP_SUMMARY
        
        # Count tables using SQL query (more reliable than parsing psql output)
        TABLE_COUNT=$(docker run --rm --network host postgres:16-alpine \
          psql "postgresql://postgres:postgres@localhost:5432/gameserverhosting_test" \
          -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")
        
        # Trim whitespace from the result
        TABLE_COUNT=$(echo "$TABLE_COUNT" | tr -d ' \n\r')
        
        echo "- **Total Tables**: $TABLE_COUNT" >> $GITHUB_STEP_SUMMARY
        
        # List table names for visibility
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tables:**" >> $GITHUB_STEP_SUMMARY
        docker run --rm --network host postgres:16-alpine \
          psql "postgresql://postgres:postgres@localhost:5432/gameserverhosting_test" \
          -t -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' ORDER BY table_name;" | \
          sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
        
        if [ "$TABLE_COUNT" -gt 0 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Database schema created successfully with $TABLE_COUNT tables**" >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **No tables found in database**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
    
    - name: Test migration rollback
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Testing Migration Rollback" >> $GITHUB_STEP_SUMMARY
        
        cd src/GameServerHosting.Infrastructure
        
        # Get the list of migrations, filtering out build messages and log output
        # Migration names follow the pattern: timestamp_MigrationName (e.g., 20251013232951_InitialCreate)
        MIGRATIONS=$(dotnet ef migrations list \
          --project . \
          --startup-project ../GameServerHosting.Api \
          --context GameServerDbContext \
          --no-connect 2>&1 | \
          grep -E '^[0-9]{14}_' | \
          tr -d ' \r')
        
        # Count migrations
        MIGRATION_COUNT=$(echo "$MIGRATIONS" | grep -c '^' || echo "0")
        
        echo "- **Total Migrations**: $MIGRATION_COUNT" >> $GITHUB_STEP_SUMMARY
        
        # If we have more than one migration, test rollback to the first one
        if [ "$MIGRATION_COUNT" -gt 1 ]; then
          FIRST_MIGRATION=$(echo "$MIGRATIONS" | head -1)
          echo "- **Rolling back to**: $FIRST_MIGRATION" >> $GITHUB_STEP_SUMMARY
          
          dotnet ef database update "$FIRST_MIGRATION" \
            --project . \
            --startup-project ../GameServerHosting.Api \
            --context GameServerDbContext \
            --connection "Host=localhost;Database=gameserverhosting_test;Username=postgres;Password=postgres"
          
          if [ $? -eq 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Migration rollback successful**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Migration rollback failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Skipping rollback test** (only one migration exists)" >> $GITHUB_STEP_SUMMARY
        fi

  code-formatting:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore GameServerHosting.sln
    
    - name: Run dotnet format check
      run: |
        echo "## Code Formatting Check 📝" >> $GITHUB_STEP_SUMMARY
        dotnet format GameServerHosting.sln --verify-no-changes --verbosity normal 2>&1 | tee format-output.log
        FORMAT_EXIT_CODE=${PIPESTATUS[0]}
        
        if [ $FORMAT_EXIT_CODE -ne 0 ]; then
          echo "⚠️ **Code formatting issues detected**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Formatting enforcement is currently in warning mode to allow gradual adoption." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please run \`dotnet format\` locally to fix formatting issues." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Once the codebase is fully formatted, this check will become mandatory." >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ **All files are properly formatted**" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true
    
    - name: Upload format results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: format-check-results
        path: format-output.log
        retention-days: 7

  build-and-test:
    name: Build and Test with Coverage
    runs-on: ubuntu-latest
    needs: [code-formatting, database-migration-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Full history for better analysis
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore GameServerHosting.sln
    
    - name: Build solution with Roslyn Analyzers
      run: |
        echo "## Build with Static Analysis 🔍" >> $GITHUB_STEP_SUMMARY
        dotnet build GameServerHosting.sln --configuration Release --no-restore 2>&1 | tee build-output.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        
        # Count warnings and errors
        WARNING_COUNT=$(grep -c "warning" build-output.log || echo "0")
        ERROR_COUNT=$(grep -c "error" build-output.log || echo "0")
        
        echo "- **Warnings**: $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **Errors**: $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
        
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Build failed with errors**" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "⚠️ **Build succeeded with $WARNING_COUNT warning(s)** - Please address these incrementally" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Build succeeded with no warnings or errors**" >> $GITHUB_STEP_SUMMARY
          fi
        fi
    
    - name: Run tests with coverage
      run: |
        echo "## Test Results 🧪" >> $GITHUB_STEP_SUMMARY
        
        # Install coverlet for code coverage
        dotnet tool install --global coverlet.console || true
        
        # Run tests with code coverage
        dotnet test GameServerHosting.sln \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        
        TEST_EXIT_CODE=$?
        
        if [ $TEST_EXIT_CODE -eq 0 ]; then
          echo "✅ **All tests passed**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
      continue-on-error: true  # Continue even if no tests found
    
    - name: Check code coverage threshold
      run: |
        # Install ReportGenerator
        dotnet tool install --global dotnet-reportgenerator-globaltool || true
        
        # Generate coverage report
        if [ -d "./coverage" ]; then
          reportgenerator \
            -reports:"./coverage/**/coverage.opencover.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Html;TextSummary;Badges" \
            || echo "No coverage reports found, skipping coverage check"
          
          # Check if coverage file exists
          if [ -f "./coverage/report/Summary.txt" ]; then
            # Extract line coverage percentage
            COVERAGE=$(grep "Line coverage:" ./coverage/report/Summary.txt | sed 's/.*: \([0-9.]*\)%.*/\1/')
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Code Coverage 📊" >> $GITHUB_STEP_SUMMARY
            echo "- **Line Coverage**: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
            echo "- **Threshold**: ${COVERAGE_THRESHOLD}%" >> $GITHUB_STEP_SUMMARY
            
            # Compare coverage with threshold
            if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "❌ **Coverage below threshold!**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Current: ${COVERAGE}% | Required: ${COVERAGE_THRESHOLD}%" >> $GITHUB_STEP_SUMMARY
              # Don't fail for now since tests might not exist
              # exit 1
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ **Coverage meets threshold**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Code Coverage 📊" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **No coverage data available** (no tests found or tests not configured for coverage)" >> $GITHUB_STEP_SUMMARY
          fi
        fi
      continue-on-error: true
    
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/report
        retention-days: 30
      continue-on-error: true
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/test-results.trx'
        check_name: 'Test Results'
      continue-on-error: true  # Don't fail if no tests found
    
    - name: Publish API artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-build
        path: src/GameServerHosting.Api/bin/Release/net8.0/
        retention-days: 7
    
    - name: Publish Client artifact
      uses: actions/upload-artifact@v4
      with:
        name: client-build
        path: src/GameServerHosting.Client/bin/Release/net8.0/
        retention-days: 7

  dependency-security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [code-formatting, database-migration-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore GameServerHosting.sln
    
    - name: Run dependency vulnerability scan
      run: |
        echo "## Dependency Vulnerability Scan 🔒" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Run vulnerability scan
        dotnet list GameServerHosting.sln package --vulnerable --include-transitive 2>&1 | tee security-scan.log
        
        # Check for critical and high vulnerabilities
        CRITICAL_COUNT=$(grep -i "critical" security-scan.log | wc -l || echo "0")
        HIGH_COUNT=$(grep -i "high" security-scan.log | wc -l || echo "0")
        MODERATE_COUNT=$(grep -i "moderate" security-scan.log | wc -l || echo "0")
        LOW_COUNT=$(grep -i "low" security-scan.log | wc -l || echo "0")
        
        echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Critical**: $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **High**: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **Moderate**: $MODERATE_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **Low**: $LOW_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Fail on Critical or High vulnerabilities
        if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
          echo "❌ **Critical or High severity vulnerabilities detected!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please update vulnerable packages before merging." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run \`dotnet list package --vulnerable --include-transitive\` locally for details." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ **No Critical or High severity vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload security scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: security-scan.log
        retention-days: 30

  container-security-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API Docker image
      run: |
        docker build -f src/GameServerHosting.Api/Dockerfile -t game-server-api:${{ github.sha }} .
    
    - name: Build Client Docker image
      run: |
        docker build -f src/GameServerHosting.Client/Dockerfile -t game-server-client:${{ github.sha }} .
    
    - name: Install Trivy
      run: |
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy
    
    - name: Scan API image with Trivy
      run: |
        echo "## Container Security Scan - API 🐳" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Run Trivy scan with .trivyignore for known base image CVEs
        trivy image --severity HIGH,CRITICAL --format json --output api-trivy-results.json game-server-api:${{ github.sha }}
        trivy image --severity HIGH,CRITICAL game-server-api:${{ github.sha }} | tee api-trivy-results.txt
        
        # Count vulnerabilities
        CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' api-trivy-results.json)
        HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' api-trivy-results.json)
        
        echo "### API Image Vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "- **Critical**: ${CRITICAL_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
        echo "- **High**: ${HIGH_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Store results for later check
        echo "API_CRITICAL=$CRITICAL_COUNT" >> $GITHUB_ENV
        echo "API_HIGH=$HIGH_COUNT" >> $GITHUB_ENV
    
    - name: Scan Client image with Trivy
      run: |
        echo "## Container Security Scan - Client 🐳" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Run Trivy scan with .trivyignore for known base image CVEs
        trivy image --severity HIGH,CRITICAL --format json --output client-trivy-results.json game-server-client:${{ github.sha }}
        trivy image --severity HIGH,CRITICAL game-server-client:${{ github.sha }} | tee client-trivy-results.txt
        
        # Count vulnerabilities
        CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' client-trivy-results.json)
        HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' client-trivy-results.json)
        
        echo "### Client Image Vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "- **Critical**: ${CRITICAL_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
        echo "- **High**: ${HIGH_COUNT:-0}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Store results for later check
        echo "CLIENT_CRITICAL=$CRITICAL_COUNT" >> $GITHUB_ENV
        echo "CLIENT_HIGH=$HIGH_COUNT" >> $GITHUB_ENV
    
    - name: Check vulnerability thresholds
      run: |
        TOTAL_CRITICAL=$((${API_CRITICAL:-0} + ${CLIENT_CRITICAL:-0}))
        TOTAL_HIGH=$((${API_HIGH:-0} + ${CLIENT_HIGH:-0}))
        
        echo "### Overall Container Security Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Total Critical**: $TOTAL_CRITICAL" >> $GITHUB_STEP_SUMMARY
        echo "- **Total High**: $TOTAL_HIGH" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$TOTAL_CRITICAL" -gt 0 ] || [ "$TOTAL_HIGH" -gt 0 ]; then
          echo "❌ **Container images have Critical or High severity vulnerabilities!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please update base images or vulnerable dependencies." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ **No Critical or High severity vulnerabilities in container images**" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload Trivy scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-scan-results
        path: |
          api-trivy-results.json
          api-trivy-results.txt
          client-trivy-results.json
          client-trivy-results.txt
        retention-days: 30

  publish-packages:
    name: Publish .NET Packages
    runs-on: ubuntu-latest
    needs: [build-and-test, dependency-security-scan, container-security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore GameServerHosting.sln
    
    - name: Publish API
      run: dotnet publish src/GameServerHosting.Api/GameServerHosting.Api.csproj --configuration Release --output ./publish/api
    
    - name: Publish Blazor Client
      run: dotnet publish src/GameServerHosting.Client/GameServerHosting.Client.csproj --configuration Release --output ./publish/client
    
    - name: Upload API publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-published
        path: ./publish/api
        retention-days: 30
    
    - name: Upload Client publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: client-published
        path: ./publish/client
        retention-days: 30
  
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-formatting, database-migration-test, build-and-test, dependency-security-scan, container-security-scan]
    if: always()
    
    steps:
    - name: Generate CI Summary
      run: |
        echo "# CI Pipeline Summary 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Job Status Overview" >> $GITHUB_STEP_SUMMARY
        echo "- Code Formatting: ${{ needs.code-formatting.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Database Migrations: ${{ needs.database-migration-test.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build & Test: ${{ needs.build-and-test.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency Security: ${{ needs.dependency-security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Container Security: ${{ needs.container-security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
