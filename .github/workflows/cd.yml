name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  release:
    types: [published]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy-api:
    name: Deploy API to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore GameServerHosting.sln
    
    - name: Build solution
      run: dotnet build GameServerHosting.sln --configuration Release --no-restore
    
    - name: Publish API
      run: dotnet publish src/GameServerHosting.Api/GameServerHosting.Api.csproj --configuration Release --output ./publish/api --no-build
    
    - name: Upload deployment package
      uses: actions/upload-artifact@v5
      with:
        name: api-deployment-${{ github.event.inputs.environment || 'staging' }}-${{ github.run_number }}
        path: ./publish/api
        retention-days: 90
    
    # Placeholder for actual deployment steps
    # Uncomment and configure based on your hosting provider
    # 
    # - name: Deploy to Azure App Service
    #   uses: azure/webapps-deploy@v2
    #   with:
    #     app-name: ${{ secrets.AZURE_API_APP_NAME }}
    #     publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
    #     package: ./publish/api
    #
    # - name: Deploy to AWS Elastic Beanstalk
    #   uses: einaregilsson/beanstalk-deploy@v21
    #   with:
    #     aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #     aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #     application_name: game-server-api
    #     environment_name: ${{ github.event.inputs.environment }}
    #     version_label: ${{ github.run_number }}
    #     region: us-east-1
    #     deployment_package: ./publish/api
    
    - name: Deployment Summary
      run: |
        echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Run Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  deploy-client:
    name: Deploy Blazor Client to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore GameServerHosting.sln
    
    - name: Build solution
      run: dotnet build GameServerHosting.sln --configuration Release --no-restore
    
    - name: Publish Blazor Client
      run: dotnet publish src/GameServerHosting.Client/GameServerHosting.Client.csproj --configuration Release --output ./publish/client --no-build
    
    - name: Upload deployment package
      uses: actions/upload-artifact@v5
      with:
        name: client-deployment-${{ github.event.inputs.environment || 'staging' }}-${{ github.run_number }}
        path: ./publish/client/wwwroot
        retention-days: 90
    
