# Development overrides for docker-compose.yml
# This file is automatically merged with docker-compose.yml when running `docker-compose up`
# To use production configuration, run: docker-compose -f docker-compose.yml up

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/GameServerHosting.Api/Dockerfile
      args:
        # Build with Development configuration
        BUILD_CONFIGURATION: Development
    environment:
      # Set environment to Development (loads appsettings.Development.json)
      ASPNETCORE_ENVIRONMENT: Development
      # Override connection string to use Docker container hostname instead of localhost
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=gameserverhosting_dev;Username=postgres;Password=postgres"
      # Override other services to use Docker hostnames
      RabbitMQ__Host: "rabbitmq"
      EmailSettings__Smtp__Host: "maildev"
    volumes:
      # Persist logs locally for debugging
      - ./logs/api:/app/logs
    ports:
      # Expose additional debug port
      - "5292:8080"
      - "5293:5293"  # Debug port (if needed)

  client:
    build:
      context: .
      dockerfile: src/GameServerHosting.Client/Dockerfile
      args:
        # Use Development configuration to load appsettings.Development.json
        BUILD_CONFIGURATION: Development
    # Note: Environment variables don't work for Blazor WASM (client-side app)
    # Configuration is baked into the build via appsettings.Development.json
    ports:
      - "5173:80"

  postgres:
    # Development: expose postgres for direct connections
    ports:
      - "5432:5432"
    # Development: enable query logging
    command: 
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
    volumes:
      # Named volume for data persistence across restarts
      - postgres_data:/var/lib/postgresql/data
      # Optional: mount initialization scripts
      # - ./database-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  maildev:
    # Already configured for development in main compose file
    # Web UI accessible at http://localhost:1080
    # SMTP server at localhost:1025
    ports:
      - "1080:1080"
      - "1025:1025"

  pgadmin:
    # Development: expose pgAdmin for database management
    ports:
      - "5050:80"
    environment:
      # Development credentials (DO NOT use in production)
      PGADMIN_DEFAULT_EMAIL: admin@moskowite.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

# Development-specific volumes
volumes:
  postgres_data:
    driver: local
    name: gameserver-postgres-data-dev
